name: Build mod

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Build and test
        run: |
          chmod +x gradlew
          ./gradlew build --no-daemon

      - name: Upload distributable mod
        uses: actions/upload-artifact@v4
        with:
          name: legacyconnector-${{ github.sha }}
          path: build/dist/legacyconnector-*.jar
          if-no-files-found: error
          retention-days: 14
